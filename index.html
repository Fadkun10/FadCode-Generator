<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR & Barcode Generator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config for Dark Mode -->
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- External Libraries -->
    <!-- EasyQRCodeJS for QR Codes with Logos -->
    <script src="https://unpkg.com/easyqrcodejs@4.6.1/dist/easy.qrcode.min.js"></script>
    <!-- JsBarcode for Barcodes -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }
        
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* Ensure generated canvas and images handle background well */
        #output-container canvas {
            max-width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        #barcode-output {
            max-width: 100%;
            height: auto;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
    </style>
    
    <script>
        // Check for saved user preference, if any, on load of the website
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="min-h-screen bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 p-4 md:p-8 flex flex-col items-center justify-center transition-colors duration-300">

    <div class="w-full max-w-5xl flex justify-end mb-4">
        <button id="theme-toggle" type="button" class="text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700 rounded-lg text-sm p-2.5 transition-colors">
            <i id="theme-toggle-dark-icon" class="fa-solid fa-moon hidden text-xl"></i>
            <i id="theme-toggle-light-icon" class="fa-solid fa-sun hidden text-xl"></i>
        </button>
    </div>

    <div class="max-w-5xl w-full bg-white dark:bg-gray-800 rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row transition-colors duration-300">
        
        <!-- Left Panel: Controls -->
        <div class="w-full md:w-1/2 p-6 md:p-8 bg-gray-50 dark:bg-gray-800 border-b md:border-b-0 md:border-r border-gray-200 dark:border-gray-700 overflow-y-auto transition-colors duration-300" style="max-height: 85vh;">
            <h1 class="text-2xl md:text-3xl font-bold mb-2 text-indigo-600 dark:text-indigo-400">
                <i class="fa-solid fa-qrcode mr-2"></i>Code Generator
            </h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mb-8">Buat QR Code atau Barcode kustom dengan mudah.</p>

            <!-- Mode Selector -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Pilih Tipe</label>
                <div class="flex rounded-md shadow-sm" role="group">
                    <button type="button" id="btn-qr-mode" class="flex-1 px-4 py-2 text-sm font-medium rounded-l-lg focus:z-10 focus:ring-2 focus:ring-indigo-500 transition-colors bg-indigo-600 text-white border border-indigo-600">
                        <i class="fa-solid fa-qrcode mr-2"></i> QR Code
                    </button>
                    <button type="button" id="btn-barcode-mode" class="flex-1 px-4 py-2 text-sm font-medium rounded-r-lg focus:z-10 focus:ring-2 focus:ring-indigo-500 transition-colors bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-600">
                        <i class="fa-solid fa-barcode mr-2"></i> Barcode
                    </button>
                </div>
            </div>

            <!-- Content Input -->
            <div class="mb-6">
                <label for="input-text" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Teks atau URL</label>
                <textarea id="input-text" rows="3" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white transition-shadow" placeholder="Masukkan teks di sini...">https://example.com</textarea>
            </div>

            <div class="mb-6 grid grid-cols-2 gap-4">
                <div>
                    <label for="color-dark" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Warna Utama</label>
                    <div class="flex items-center">
                        <input type="color" id="color-dark" value="#000000" class="h-10 w-full rounded cursor-pointer border-0 p-0 bg-transparent">
                    </div>
                </div>
                <div>
                    <label for="color-light" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Warna Latar</label>
                    <div class="flex items-center">
                        <input type="color" id="color-light" value="#ffffff" class="h-10 w-full rounded cursor-pointer border-0 p-0 bg-transparent">
                    </div>
                </div>
            </div>

            <!-- QR Specific Settings -->
            <div id="qr-settings" class="mb-6 p-4 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg shadow-sm transition-colors duration-300">
                <h3 class="text-sm font-semibold text-gray-800 dark:text-gray-200 mb-3"><i class="fa-solid fa-image mr-1"></i> Pengaturan QR</h3>
                <div class="space-y-3">
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" id="use-logo" class="rounded text-indigo-600 focus:ring-indigo-500 bg-gray-100 dark:bg-gray-600 border-gray-300 dark:border-gray-500">
                        <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">Tambahkan Gambar di Tengah</span>
                    </label>
                    <div id="logo-upload-container" class="hidden transition-all duration-300">
                        <input type="file" id="logo-input" accept="image/*" class="block w-full text-sm text-gray-500 dark:text-gray-400
                            file:mr-4 file:py-2 file:px-4
                            file:rounded-md file:border-0
                            file:text-sm file:font-semibold
                            file:bg-indigo-50 dark:file:bg-indigo-900/30 file:text-indigo-700 dark:file:text-indigo-400
                            hover:file:bg-indigo-100 dark:hover:file:bg-indigo-800/40
                            cursor-pointer
                        "/>
                        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Gunakan gambar rasio 1:1 (kotak) untuk hasil terbaik.</p>
                    </div>
                </div>
            </div>

            <!-- Barcode Specific Settings -->
            <div id="barcode-settings" class="mb-6 p-4 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg shadow-sm hidden transition-colors duration-300">
                <h3 class="text-sm font-semibold text-gray-800 dark:text-gray-200 mb-3"><i class="fa-solid fa-barcode mr-1"></i> Pengaturan Barcode</h3>
                <label class="flex items-center cursor-pointer">
                    <input type="checkbox" id="show-text" checked class="rounded text-indigo-600 focus:ring-indigo-500 bg-gray-100 dark:bg-gray-600 border-gray-300 dark:border-gray-500">
                    <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">Tampilkan Teks di Bawah Barcode</span>
                </label>
            </div>

            <div id="error-message" class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm font-medium"></div>

            <button id="btn-generate" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow transition duration-200 flex items-center justify-center">
                <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Generate
            </button>
        </div>

        <!-- Right Panel: Preview & Download -->
        <div class="w-full md:w-1/2 bg-white dark:bg-gray-900 p-6 md:p-8 flex flex-col items-center justify-center transition-colors duration-300">
            
            <h2 class="text-xl font-semibold mb-6 text-gray-800 dark:text-gray-200">Pratinjau</h2>
            
            <!-- Output Container for Canvas/Img -->
            <div id="output-wrapper" class="w-full flex items-center justify-center min-h-[300px] bg-gray-50 dark:bg-gray-800 rounded-xl border-2 border-dashed border-gray-300 dark:border-gray-600 p-4 mb-6 transition-colors duration-300">
                <!-- Empty state -->
                <div id="empty-state" class="text-center text-gray-400 dark:text-gray-500">
                    <i class="fa-solid fa-image text-4xl mb-2"></i>
                    <p class="mt-2">Hasil akan muncul di sini</p>
                </div>
                
                <!-- The actual output elements -->
                <div id="output-container" class="hidden w-full flex justify-center items-center">
                    <!-- QR Code uses this div for easyqrcodejs -->
                    <div id="qrcode-output"></div>
                    <!-- Barcode uses this img element for jsbarcode -->
                    <img id="barcode-output" class="hidden" alt="Barcode Output" />
                </div>
            </div>

            <!-- Download Button -->
            <button id="btn-download" disabled class="w-full md:w-auto bg-green-500 hover:bg-green-600 disabled:bg-gray-300 dark:disabled:bg-gray-700 disabled:text-gray-500 dark:disabled:text-gray-600 disabled:cursor-not-allowed text-white font-bold py-3 px-8 rounded-lg shadow transition duration-200 flex items-center justify-center">
                <i class="fa-solid fa-download mr-2"></i> Download PNG
            </button>
            
        </div>
    </div>

    <!-- Footer Credit -->
    <div class="mt-8 text-center text-sm text-gray-500 dark:text-gray-400">
        Dibuat oleh <span class="font-semibold text-indigo-600 dark:text-indigo-400">Fadkun10</span>
    </div>

    <script>
        /* 
         * Application Logic 
         */

        // --- Theme Toggle Logic ---
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');
        const themeToggleBtn = document.getElementById('theme-toggle');

        // Change the icons inside the button based on previous settings
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            themeToggleLightIcon.classList.remove('hidden');
        } else {
            themeToggleDarkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            // toggle icons inside button
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');

            // if set via local storage previously
            if (localStorage.getItem('color-theme')) {
                if (localStorage.getItem('color-theme') === 'light') {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                }
            // if NOT set via local storage previously
            } else {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                }
            }
        });

        // --- State variables ---
        let currentMode = 'qr'; // 'qr' or 'barcode'
        let uploadedLogoUrl = null;

        // --- DOM Elements ---
        const btnQrMode = document.getElementById('btn-qr-mode');
        const btnBarcodeMode = document.getElementById('btn-barcode-mode');
        
        const inputText = document.getElementById('input-text');
        const colorDark = document.getElementById('color-dark');
        const colorLight = document.getElementById('color-light');
        
        const qrSettings = document.getElementById('qr-settings');
        const barcodeSettings = document.getElementById('barcode-settings');
        
        const useLogoCheckbox = document.getElementById('use-logo');
        const logoUploadContainer = document.getElementById('logo-upload-container');
        const logoInput = document.getElementById('logo-input');
        
        const showTextCheckbox = document.getElementById('show-text');
        
        const btnGenerate = document.getElementById('btn-generate');
        const btnDownload = document.getElementById('btn-download');
        const errorMessage = document.getElementById('error-message');
        
        const emptyState = document.getElementById('empty-state');
        const outputContainer = document.getElementById('output-container');
        const qrcodeOutput = document.getElementById('qrcode-output');
        const barcodeOutput = document.getElementById('barcode-output');

        // --- UI Logic & Mode Switching ---
        function setMode(mode) {
            currentMode = mode;
            hideError();
            if (mode === 'qr') {
                // Update buttons
                btnQrMode.className = 'flex-1 px-4 py-2 text-sm font-medium rounded-l-lg focus:z-10 focus:ring-2 focus:ring-indigo-500 transition-colors bg-indigo-600 text-white border border-indigo-600';
                btnBarcodeMode.className = 'flex-1 px-4 py-2 text-sm font-medium rounded-r-lg focus:z-10 focus:ring-2 focus:ring-indigo-500 transition-colors bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-600';
                
                // Toggle settings visibility
                qrSettings.classList.remove('hidden');
                barcodeSettings.classList.add('hidden');
            } else {
                // Update buttons
                btnBarcodeMode.className = 'flex-1 px-4 py-2 text-sm font-medium rounded-r-lg focus:z-10 focus:ring-2 focus:ring-indigo-500 transition-colors bg-indigo-600 text-white border border-indigo-600';
                btnQrMode.className = 'flex-1 px-4 py-2 text-sm font-medium rounded-l-lg focus:z-10 focus:ring-2 focus:ring-indigo-500 transition-colors bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-600';
                
                // Toggle settings visibility
                barcodeSettings.classList.remove('hidden');
                qrSettings.classList.add('hidden');
            }
        }

        btnQrMode.addEventListener('click', () => setMode('qr'));
        btnBarcodeMode.addEventListener('click', () => setMode('barcode'));

        // Toggle Logo Upload Input
        useLogoCheckbox.addEventListener('change', (e) => {
            if (e.target.checked) {
                logoUploadContainer.classList.remove('hidden');
            } else {
                logoUploadContainer.classList.add('hidden');
                uploadedLogoUrl = null; // Clear if unchecked
                logoInput.value = '';
            }
        });

        // Handle Logo Image Upload to Data URL
        logoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedLogoUrl = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // --- Helper Functions ---
        function hideOutput() {
            emptyState.classList.remove('hidden');
            outputContainer.classList.add('hidden');
            btnDownload.disabled = true;
        }

        function showOutput() {
            emptyState.classList.add('hidden');
            outputContainer.classList.remove('hidden');
            btnDownload.disabled = false;
        }
        
        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.remove('hidden');
            hideOutput();
        }
        
        function hideError() {
            errorMessage.classList.add('hidden');
        }

        // --- Core Generation Logic ---
        function generateQR(text, darkColor, lightColor) {
            // Clean up previous instance
            qrcodeOutput.innerHTML = '';
            qrcodeOutput.classList.remove('hidden');
            barcodeOutput.classList.add('hidden');

            const options = {
                text: text,
                width: 256,
                height: 256,
                colorDark: darkColor,
                colorLight: lightColor,
                correctLevel: QRCode.CorrectLevel.H, // High correction is good for logos
                quietZone: 15,
                quietZoneColor: lightColor // Match the background
            };

            if (useLogoCheckbox.checked && uploadedLogoUrl) {
                options.logo = uploadedLogoUrl;
                options.logoWidth = 60;
                options.logoHeight = 60;
                options.logoBackgroundColor = lightColor;
                options.logoBackgroundTransparent = false;
            }

            try {
                // Initialize new EasyQRCode
                new QRCode(qrcodeOutput, options);
                showOutput();
            } catch (err) {
                showError("Gagal membuat QR Code. Silakan coba lagi.");
                console.error(err);
            }
        }

        function generateBarcode(text, darkColor, lightColor) {
            qrcodeOutput.classList.add('hidden');
            barcodeOutput.classList.remove('hidden');
            
            try {
                // Generate Barcode into the img element
                JsBarcode("#barcode-output", text, {
                    format: "CODE128", // Most versatile barcode format
                    lineColor: darkColor,
                    background: lightColor,
                    displayValue: showTextCheckbox.checked,
                    margin: 15,
                    width: 2,
                    height: 100
                });
                showOutput();
            } catch (err) {
                // JsBarcode throws if text has invalid characters for CODE128 (rare, but possible depending on encoding)
                showError("Teks mengandung karakter yang tidak didukung oleh format Barcode. Coba gunakan format teks yang lebih sederhana.");
                console.error(err);
            }
        }

        // Handle Generate Button Click
        btnGenerate.addEventListener('click', () => {
            hideError();
            const text = inputText.value.trim();
            const darkColor = colorDark.value;
            const lightColor = colorLight.value;

            if (!text) {
                showError("Mohon masukkan teks atau URL terlebih dahulu.");
                return;
            }

            if (currentMode === 'qr') {
                // Wait briefly if checking logo state
                if (useLogoCheckbox.checked && !uploadedLogoUrl && logoInput.files.length > 0) {
                    // Small delay to let FileReader finish if it was just selected
                    setTimeout(() => generateQR(text, darkColor, lightColor), 100);
                } else {
                    generateQR(text, darkColor, lightColor);
                }
            } else {
                generateBarcode(text, darkColor, lightColor);
            }
        });

        // Handle Download Button Click
        btnDownload.addEventListener('click', () => {
            let dataUrl = null;
            let filename = '';

            if (currentMode === 'qr') {
                const canvas = qrcodeOutput.querySelector('canvas');
                if (canvas) {
                    dataUrl = canvas.toDataURL('image/png');
                    filename = 'qrcode.png';
                }
            } else {
                // For barcode, it's generated into an img src as base64
                if (barcodeOutput.src) {
                    dataUrl = barcodeOutput.src;
                    filename = 'barcode.png';
                }
            }

            if (dataUrl) {
                const link = document.createElement('a');
                link.href = dataUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } else {
                showError("Tidak ada gambar untuk di-download.");
            }
        });

        // Initialize state on load
        setMode('qr');
        
    </script>
</body>
</html>
